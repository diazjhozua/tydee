services:
  postgres:
    image: postgres:18-alpine
    container_name: tydee-postgres
    environment:
      - POSTGRES_USER=tydee
      - POSTGRES_PASSWORD=Tydee_Dev123!
      - POSTGRES_DB=tydee
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 5432:5432

  seq:
    image: datalust/seq:2024.3
    container_name: tydee-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80

volumes:
  postgres-data:
