name: Deploy Client

on:
  push:
    branches: [main]
    paths:
      - "src/Web.Client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/Web.Client
          output_location: ""
        env:
          # Baked into the client bundle at build time; public by design
          NEXT_PUBLIC_API_URL: https://app-tydee-stg-api-jhozua.azurewebsites.net
