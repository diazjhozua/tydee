name: Keep Warm

# Best-effort: GitHub cron can run several minutes late at busy times, so an
# occasional gap over ~20 min (and the resulting cold start) is expected.
# GitHub also auto-disables schedules after 60 days of repo inactivity
# (with an email warning) - re-enable manually from the Actions tab if hit.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 15 \
            https://app-tydee-stg-api-jhozua.azurewebsites.net/ping
