name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: diazjhozua/relcut/.github/workflows/release.yml@v1
    with:
      # Empty on purpose: release-please ignores release-please-config.json
      # whenever a release-type is set, and we need the config's extra-files
      # to keep src/Web.Client/package.json's version in sync.
      release-type: ""

  close-released-issues:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Close issues referenced by pull requests in this release
        run: |
          prev_tag=$(gh release list --repo "$REPO" --exclude-drafts --limit 5 --json tagName --jq '.[].tagName' | grep -vxF "$TAG_NAME" | head -n 1 || true)
          if [ -z "$prev_tag" ]; then
            echo "No previous release; nothing to close."
            exit 0
          fi

          bodies=""
          for sha in $(git log --first-parent --format=%H "$prev_tag..$TAG_NAME"); do
            bodies+="$(gh api "repos/$REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null) | .body // ""')"
            bodies+=$'\n'
          done

          issues=$(grep -oE 'Refs #[0-9]+' <<< "$bodies" | grep -oE '[0-9]+' | sort -un || true)
          for n in $issues; do
            state=$(gh api "repos/$REPO/issues/$n" --jq 'select(.pull_request == null) | .state' 2>/dev/null || true)
            if [ "$state" != "open" ]; then
              echo "Skip #$n (state: ${state:-not an open issue})"
              continue
            fi
            gh issue comment "$n" --repo "$REPO" --body "Released in $TAG_NAME: $RELEASE_URL"
            gh issue close "$n" --repo "$REPO" --reason completed
          done
